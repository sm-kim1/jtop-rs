[package]
name = "jtop-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust TUI alternative to jetson_stats (jtop) for NVIDIA Jetson devices"
license = "MIT"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SSH for remote Jetson access
ssh2 = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info (fallback)
sysinfo = "0.33"

# Time
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
