name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: jtop-rs-aarch64-linux
          - target: x86_64-unknown-linux-gnu
            artifact: jtop-rs-x86_64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cp "target/${TARGET}/release/jtop-rs" "${ARTIFACT}"
          chmod +x "${ARTIFACT}"
          tar czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "jtop-rs ${TAG_NAME}" \
            --generate-notes \
            --notes "## Installation (Jetson AGX Orin / Orin NX - aarch64)

          \`\`\`bash
          wget https://github.com/sm-kim1/jtop-rs/releases/download/${TAG_NAME}/jtop-rs-aarch64-linux.tar.gz
          tar xzf jtop-rs-aarch64-linux.tar.gz
          chmod +x jtop-rs-aarch64-linux
          sudo mv jtop-rs-aarch64-linux /usr/local/bin/jtop-rs
          jtop-rs
          \`\`\`

          ## For x86_64 (remote monitoring via SSH)

          \`\`\`bash
          wget https://github.com/sm-kim1/jtop-rs/releases/download/${TAG_NAME}/jtop-rs-x86_64-linux.tar.gz
          tar xzf jtop-rs-x86_64-linux.tar.gz
          chmod +x jtop-rs-x86_64-linux
          sudo mv jtop-rs-x86_64-linux /usr/local/bin/jtop-rs
          jtop-rs -H 192.168.100.54 -u aceworks
          \`\`\`" \
            artifacts/**/*.tar.gz \
            artifacts/**/*.sha256
